<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Car HUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --hud:#4fd8ff; --warn:#ffb340; --bg:#05090d; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; background:var(--bg); color:var(--hud); font-family:'Rajdhani',system-ui,sans-serif; overflow:hidden; }
  video { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; }
  #reticle { position:fixed; left:50%; top:46%; transform:translate(-50%,-50%); pointer-events:none; }
  #reticle i { position:absolute; width:28px; height:28px; border:3px solid var(--hud); }
  #reticle i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
  #reticle i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
  #reticle i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
  #reticle i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
  #reticle.lost i { border-color:var(--warn); }
  #reticle b { position:absolute; left:8%; right:8%; height:2px; background:var(--hud); opacity:.6; box-shadow:0 0 10px var(--hud); animation:scan 2.2s ease-in-out infinite alternate; }
  @keyframes scan { from{top:6%} to{top:94%} }
  @media (prefers-reduced-motion:reduce){ #reticle b{animation:none;top:50%} }
  #panel { position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px)); max-width:460px; margin:0 auto;
    background:rgba(5,15,22,.78); border:1px solid var(--hud); padding:12px 16px; backdrop-filter:blur(6px); }
  #panel h1 { font-size:1.9rem; line-height:1.05; font-weight:700; }
  #panel dl { display:grid; grid-template-columns:auto 1fr; gap:2px 14px; margin-top:8px; font-size:1.05rem; color:#d8f6ff; }
  #panel dt { color:var(--hud); opacity:.7; }
  #panel p { margin-top:8px; font-size:1rem; color:#d8f6ff; }
  .bar { height:4px; background:rgba(79,216,255,.2); margin-top:10px; }
  .bar div { height:100%; width:0; background:var(--hud); transition:width .25s; }
  #alts { margin-top:6px; font-size:.95rem; opacity:.75; }
  #status { position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); left:12px; right:12px; text-align:center; font-size:1.05rem; text-shadow:0 0 6px #000; }
  #start { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:var(--bg); padding:24px; text-align:center; }
  #start h2 { font-size:2.4rem; }
  #start p { max-width:32ch; color:#d8f6ff; font-size:1.1rem; }
  button { font:inherit; font-weight:700; font-size:1.2rem; color:var(--bg); background:var(--hud); border:0; padding:12px 28px; cursor:pointer; }
  button:focus-visible { outline:3px solid #fff; outline-offset:3px; }
  #flip { position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); right:12px; display:none; font-size:.95rem; padding:6px 12px; }
</style>
</head>
<body>
<video id="cam" playsinline muted></video>
<div id="reticle" hidden><i></i><i></i><i></i><i></i><b></b></div>
<div id="status"></div>
<button id="flip" type="button">Kamera wechseln</button>
<div id="panel" hidden>
  <h1 id="name"></h1>
  <dl id="facts"></dl>
  <p id="note"></p>
  <div class="bar"><div id="conf"></div></div>
  <div id="alts"></div>
</div>
<div id="start">
  <h2>Car HUD</h2>
  <p>Richte die Kamera auf ein Auto und halte es in den Rahmen. Beim ersten Start lädt die KI einmalig ca. 150 MB.</p>
  <button id="go" type="button">Kamera starten</button>
</div>

<script>
/* ============ HIER ERGÄNZEN ============
   prompt = englische Beschreibung, nach der die KI sucht.
   Die Angaben (since, origin, ...) bitte selbst prüfen und erweitern. */
const CARS = [
  {prompt:"Volkswagen Golf", brand:"Volkswagen", model:"Golf", since:"1974", origin:"Deutschland", cls:"Kompaktklasse", note:"Aktuell in der 8. Generation (seit 2019)."},
  {prompt:"BMW 3 Series", brand:"BMW", model:"3er", since:"1975", origin:"Deutschland", cls:"Mittelklasse", note:"Aktuelle Generation G20 seit 2018."},
  {prompt:"Audi A4", brand:"Audi", model:"A4", since:"1994", origin:"Deutschland", cls:"Mittelklasse", note:"Löste den Audi 80 ab."},
  {prompt:"Mercedes-Benz C-Class", brand:"Mercedes-Benz", model:"C-Klasse", since:"1993", origin:"Deutschland", cls:"Mittelklasse", note:"Aktuelle Generation W206 seit 2021."},
  {prompt:"Tesla Model 3", brand:"Tesla", model:"Model 3", since:"2017", origin:"USA", cls:"Mittelklasse (Elektro)", note:"Rein elektrische Limousine."},
  {prompt:"Porsche 911", brand:"Porsche", model:"911", since:"1963", origin:"Deutschland", cls:"Sportwagen", note:"Klassischer Heckmotor-Sportwagen."},
  {prompt:"Toyota Corolla", brand:"Toyota", model:"Corolla", since:"1966", origin:"Japan", cls:"Kompaktklasse", note:"Eine der meistverkauften Modellreihen weltweit."},
  {prompt:"Ford Mustang", brand:"Ford", model:"Mustang", since:"1964", origin:"USA", cls:"Sportcoupé", note:"Ur-Vertreter der Pony Cars."},
  {prompt:"Fiat 500", brand:"Fiat", model:"500", since:"1957", origin:"Italien", cls:"Kleinwagen", note:"Aktuelle Neuauflage seit 2007."},
  {prompt:"Mini Cooper", brand:"Mini", model:"Cooper", since:"1959", origin:"Großbritannien", cls:"Kleinwagen", note:"Neuauflage unter BMW seit 2001."}
];
/* Ablenker, damit Nicht-Autos nicht als Auto erkannt werden */
const OTHERS = ["a road","a person","a building","a tree and sky","a room interior","a truck","a motorcycle","a bicycle","a car brand that is not in the list"];
/* ======================================== */

const MODEL_ID = "Xenova/clip-vit-base-patch32";
const SMOOTH = 4, MIN_CONF = 0.5, VIEW_FRAC = 0.62;
const $ = id => document.getElementById(id);
const video = $("cam"), statusEl = $("status"), reticle = $("reticle"), panel = $("panel");
let facing = "environment", stream = null;

function say(t){ statusEl.textContent = t; }

async function startCamera(){
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:facing, width:{ideal:1280}}, audio:false});
  video.srcObject = stream;
  await video.play();
}

function layoutReticle(){
  const s = Math.round(Math.min(innerWidth, innerHeight) * VIEW_FRAC);
  reticle.style.width = reticle.style.height = s + "px";
  return s;
}

$("go").onclick = async () => {
  $("go").disabled = true;
  try {
    await startCamera();
  } catch (e) {
    say("Kamera nicht verfügbar. Erlaube den Zugriff und öffne die Seite über https.");
    $("go").disabled = false; return;
  }
  $("start").hidden = true; $("flip").style.display = "block";
  reticle.hidden = false; layoutReticle();
  try { await run(); } catch (e) { console.error(e); say("Fehler: " + e.message); }
};
$("flip").onclick = async () => { facing = facing === "environment" ? "user" : "environment"; await startCamera(); };
addEventListener("resize", layoutReticle);

async function run(){
  say("Lade KI-Modell …");
  const T = await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3");
  const files = {};
  const opts = { dtype:"q8", progress_callback: p => {
    if (p.status === "progress" && p.total) {
      files[p.file] = {l:p.loaded, t:p.total};
      let l = 0, t = 0; for (const k in files){ l += files[k].l; t += files[k].t; }
      say("Lade KI-Modell … " + Math.round(l / t * 100) + " %");
    }
  }};
  const tokenizer = await T.AutoTokenizer.from_pretrained(MODEL_ID);
  const textModel = await T.CLIPTextModelWithProjection.from_pretrained(MODEL_ID, opts);
  const processor = await T.AutoProcessor.from_pretrained(MODEL_ID);
  const visionModel = await T.CLIPVisionModelWithProjection.from_pretrained(MODEL_ID, opts);

  say("Bereite Autoliste vor …");
  const labels = [...CARS.map(c => `a photo of a ${c.prompt} car`), ...OTHERS.map(o => `a photo of ${o}`)];
  const ti = tokenizer(labels, {padding:true, truncation:true});
  const {text_embeds} = await textModel(ti);
  const textVecs = text_embeds.normalize().tolist();

  const work = document.createElement("canvas"); work.width = work.height = 224;
  const ctx = work.getContext("2d");
  const history = [];
  let lastKey = "";

  const softmax = a => { const m = Math.max(...a), e = a.map(x => Math.exp(x - m)), s = e.reduce((p, q) => p + q); return e.map(x => x / s); };

  say("Halte ein Auto in den Rahmen");
  while (true) {
    if (video.readyState >= 2 && !document.hidden) {
      // Bildausschnitt passend zum Rahmen (object-fit: cover berücksichtigen)
      const vw = video.videoWidth, vh = video.videoHeight;
      const scale = Math.max(innerWidth / vw, innerHeight / vh);
      const side = Math.min(vw, vh, Math.round(layoutReticle() / scale));
      const sx = (vw - side) / 2, sy = vh * 0.5 - (innerHeight * 0.04) / scale - side / 2;
      ctx.drawImage(video, sx, Math.max(0, Math.min(vh - side, sy)), side, side, 0, 0, 224, 224);

      const img = T.RawImage.fromCanvas(work).rgb();
      const {image_embeds} = await visionModel(await processor(img));
      const v = image_embeds.normalize().tolist()[0];
      const probs = softmax(textVecs.map(t => 100 * t.reduce((s, x, i) => s + x * v[i], 0)));

      history.push(probs); if (history.length > SMOOTH) history.shift();
      const avg = probs.map((_, i) => history.reduce((s, h) => s + h[i], 0) / history.length);
      show(avg);
    }
    await new Promise(r => setTimeout(r, 30)); // Browser Luft geben
  }

  function show(avg){
    const order = avg.map((p, i) => [p, i]).sort((a, b) => b[0] - a[0]);
    const [p, i] = order[0];
    const found = i < CARS.length && p >= MIN_CONF;
    reticle.classList.toggle("lost", !found);
    if (!found) { panel.hidden = true; say("Kein bekanntes Auto im Rahmen"); return; }
    say(""); panel.hidden = false;
    const c = CARS[i];
    if (lastKey !== c.prompt) {
      lastKey = c.prompt;
      $("name").textContent = `${c.brand} ${c.model}`;
      $("facts").innerHTML = "";
      for (const [k, val] of [["Seit", c.since], ["Herkunft", c.origin], ["Klasse", c.cls]]) {
        const dt = document.createElement("dt"), dd = document.createElement("dd");
        dt.textContent = k; dd.textContent = val; $("facts").append(dt, dd);
      }
      $("note").textContent = c.note;
    }
    $("conf").style.width = Math.round(p * 100) + "%";
    const alts = order.slice(1, 3).filter(([q, j]) => j < CARS.length && q > 0.05)
      .map(([q, j]) => `${CARS[j].brand} ${CARS[j].model} ${Math.round(q * 100)} %`);
    $("alts").textContent = `Sicherheit ${Math.round(p * 100)} %` + (alts.length ? "  ·  Auch möglich: " + alts.join(", ") : "");
  }
}
</script>
</body>
</html>
